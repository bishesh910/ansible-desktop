# Minimal two-line prompt, muted colours, no background blocks
add_newline = true
format = """
$directory$git_branch$git_status$python$nodejs$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"

[directory]
style = "bold #7aa2f7"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "#bb9af7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#e0af68"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "took [$duration]($style) "

[python]
symbol = " "
style = "#9ece6a"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#9ece6a"
format = "[$symbol$version]($style) "
