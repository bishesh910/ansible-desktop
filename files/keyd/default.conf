# Mac-style modifiers for PC-layout keyboards (keyd)
#
# Physical key beside Space ("alt/cmd", sends leftalt)    -> Cmd
# Physical key left of that ("start/opt", sends leftmeta) -> Option
# Ctrl stays Ctrl, so Ctrl+C in a terminal still interrupts.
#
# Option holds Shift while pressed, so Option+drag selects text in a terminal
# that captures the mouse (like Option+drag on macOS) and Option+Enter = Shift+Enter.
# Option+key types Mac symbols (Option+e e = é, Option+8 = •, Option+Shift+- = —)
# because GNOME's layout is English (Macintosh) and keyd sends the 3rd-level key.
#
# Disable with:  sudo systemctl disable --now keyd

[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)
rightmeta = layer(opt)

# Cmd behaves like Ctrl, with Mac-specific overrides below.
[cmd:C]
# Cmd+Space: Search Light launcher (bound to Super+Space)
space = M-space
# Copy / paste / cut that also work inside the terminal
c = C-insert
v = S-insert
x = S-delete
# Cmd+Q closes the window, Cmd+H / Cmd+M minimize
q = A-f4
h = M-h
m = M-h
# Cmd+arrows: line start/end, document start/end
left = home
right = end
up = C-home
down = C-end
# Cmd+[ / Cmd+]: back / forward
[ = A-left
] = A-right
# Cmd+1..9: switch to tab N
1 = A-1
2 = A-2
3 = A-3
4 = A-4
5 = A-5
6 = A-6
7 = A-7
8 = A-8
9 = A-9
# Cmd+Tab: app switcher (hold Cmd, keep tapping Tab)
tab = swapm(app_switch, M-tab)
# Cmd+`: next window of the same app
` = M-`
# Cmd then Shift: enter the Cmd+Shift layer
leftshift = layer(cmd_shift)
rightshift = layer(cmd_shift)

# Cmd+Shift+... behaves like Ctrl+Shift+..., with overrides.
[cmd_shift:C-S]
# Cmd+Shift+3/4/5: screenshot UI
3 = sysrq
4 = sysrq
5 = sysrq
# Cmd+Shift+[ / ]: previous / next tab
[ = C-pageup
] = C-pagedown
# Cmd+Shift+arrows: select to line / document boundaries
left = S-home
right = S-end
up = C-S-home
down = C-S-end

[app_switch:M]
tab = M-tab
right = M-tab
` = M-S-tab
left = M-S-tab

# Option: holds Shift (for mouse selection in terminals), Mac symbols via the
# layout's 3rd level (AltGr) on printable keys, and Mac-style word navigation.
[opt:S]
a = G-a
b = G-b
c = G-c
d = G-d
e = G-e
f = G-f
g = G-g
h = G-h
i = G-i
j = G-j
k = G-k
l = G-l
m = G-m
n = G-n
o = G-o
p = G-p
q = G-q
r = G-r
s = G-s
t = G-t
u = G-u
v = G-v
w = G-w
x = G-x
y = G-y
z = G-z
1 = G-1
2 = G-2
3 = G-3
4 = G-4
5 = G-5
6 = G-6
7 = G-7
8 = G-8
9 = G-9
0 = G-0
minus = G-minus
equal = G-equal
leftbrace = G-leftbrace
rightbrace = G-rightbrace
backslash = G-backslash
semicolon = G-semicolon
apostrophe = G-apostrophe
comma = G-comma
dot = G-dot
slash = G-slash
grave = G-grave
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# Ctrl+Cmd(Alt)+Q: lock the screen (GNOME's Super+L). Without this, Cmd+Q's
# Alt+F4 combined with a held Ctrl became Ctrl+Alt+F4, which switches to
# virtual terminal 4 and makes the desktop look like it was killed.
# (Composite layers must come after the layers they combine.)
[control+cmd]
q = M-l
