---
# The desktop user whose home gets customised. Defaults to whoever runs the playbook.
desktop_user: "{{ lookup('env', 'USER') }}"
desktop_home: "/home/{{ desktop_user }}"

# GNOME Shell major version used when downloading extensions. Leave empty to auto-detect
# from `gnome-shell --version` (48 on Debian 13, 46 on Ubuntu 24.04, 42 on Ubuntu 22.04...).
gnome_shell_version: ""

# --- what to install (apt) ---------------------------------------------------
# Packages a release does not ship are skipped with a note, not an error.
apt_packages:
  - keyd                            # Mac-style modifier remapping (built from source if not packaged)
  - gnome-shell-extension-appindicator
  - papirus-icon-theme
  - flatpak
  - gnome-terminal
  - tilix                           # default terminal: tabs can be renamed and the name sticks
  - xdg-terminal-exec               # newer GNOME picks the default terminal from ~/.config/xdg-terminals.list
  - dconf-cli
  - curl
  - git
  - unzip
  - xz-utils
  - tmux
  - htop
  - fonts-noto-core                 # Devanagari coverage
  - remmina
  - sassc                           # } needed by the WhiteSur theme build
  - libglib2.0-dev-bin              # }
  - libxml2-utils                   # }
  - patch                           # applies files/search-light/*.patch
  - imagemagick                     # Search Light's blurred backdrop (`convert`)
  - gnome-shell-extension-manager   # Extension Manager app (Ubuntu 24.04+ / Debian 13)

keyd_source_version: v2.5.0         # only used when keyd is not in the distro's repos

install_vscode: true
install_chrome: true
install_sublime_text: true

# VPN / remote-access tooling and the desktop chat app, each from its vendor apt repo
# (signing keys are shipped in files/apt-keyrings). Turn off what you do not want; a repo that is
# turned off is removed from /etc/apt/sources.list.d, its package is left alone (apt purge it by hand).
install_tailscale: false            # tailscaled enabled; run `sudo tailscale up` once to log in
install_teleport: true              # tsh client only; the teleport service is left disabled
teleport_channel: stable/v18
install_netbird: false              # netbird service + tray UI + autostart entry
install_claude_desktop: true
# The JumpCloud agent (jcagent) is enrolment-specific and deliberately not managed here.

flatpak_user_apps:
  - com.bitwarden.desktop

telegram_version: "7.2.7"           # official tdesktop tarball, self-updates afterwards
starship_install: true

# GNOME Shell extensions from extensions.gnome.org (uuid -> shown in Extension Manager)
gnome_extensions:
  - dash-to-dock@micxgx.gmail.com
  - clipboard-indicator@tudmotu.com
  - caffeine@patapon.info
  - user-theme@gnome-shell-extensions.gcampax.github.com

# Search Light is built from GitHub instead: extensions.gnome.org only has v42 (GNOME <= 49).
# The pinned commit supports GNOME 50 but aborts GNOME Shell right after login (re-entrant hide()),
# so files/search-light/pr164-hide-reentrancy.patch (upstream PR #164) is applied on top.
# Never click Install/Update on it in Extension Manager: that pulls v42 back.
search_light_repo: https://github.com/icedman/search-light.git
search_light_commit: 4e93e0e3e2fba8512dfd588177b7a6a2a71c9f1e

gnome_extensions_enabled:
  - ubuntu-appindicators@ubuntu.com   # from the apt package above (Ubuntu ships it already)
  - search-light@icedman.github.com
  - clipboard-indicator@tudmotu.com
  - caffeine@patapon.info
  - user-theme@gnome-shell-extensions.gcampax.github.com
  - dash-to-dock@micxgx.gmail.com
# Extra extensions to keep enabled per distribution. Ubuntu's own dock is replaced by Dash to Dock
# (same settings schema), but its desktop icons and tiling assistant stay.
gnome_extensions_enabled_extra:
  Ubuntu:
    - ding@rastersoft.com
    - tiling-assistant@ubuntu.com
# Extensions the session mode force-loads even when they are NOT in enabled-extensions
# (/usr/share/gnome-shell/modes/ubuntu.json). The only way to keep them off is the
# disabled-extensions key. Ubuntu Dock is a fork of Dash to Dock; loading both makes the second
# one throw "DockManager.getDefault() is null" inside the overview, which then renders empty
# (no apps in the launcher, no search results). Merged into disabled-extensions, never overwritten.
gnome_extensions_disabled_extra:
  Ubuntu:
    - ubuntu-dock@ubuntu.com
# NEVER add dash2dock-lite@icedman.github.com: it crashed GNOME Shell whenever an app quit.

# Themes (built from upstream git, installed into the user's home)
whitesur_theme: true                # ~/.themes/WhiteSur-Dark-purple (+ libadwaita css, cursors), used by the user-theme extension
tela_icons: true                    # ~/.local/share/icons/Tela-{blue,purple}[-dark|-light]
tela_colors: [blue, purple]

# dconf settings to load: path -> file under files/dconf/
dconf_loads:
  /org/gnome/desktop/wm/preferences/: wm-preferences.ini
  /org/gnome/desktop/wm/keybindings/: wm-keybindings.ini
  /org/gnome/desktop/interface/: interface.ini
  /org/gnome/desktop/input-sources/: input-sources.ini
  /desktop/ibus/general/hotkey/: ibus-hotkey.ini                  # IBus must not grab Super+Space (Search Light)
  /org/gnome/desktop/peripherals/: peripherals.ini
  /org/gnome/desktop/session/: session.ini
  /org/gnome/desktop/screensaver/: screensaver.ini
  /org/gnome/desktop/default-applications/terminal/: default-terminal.ini   # older GNOME (Ubuntu 22.04/24.04)
  /org/gnome/settings-daemon/plugins/media-keys/: media-keys.ini
  /org/gnome/settings-daemon/plugins/color/: color.ini
  /org/gnome/shell/keybindings/: shell-keybindings.ini
  /org/gnome/shell/: shell.ini                                   # dock favourites only
  /org/gnome/terminal/legacy/: terminal.ini
  /com/gexperts/Tilix/: tilix.ini
  /org/gnome/shell/extensions/dash-to-dock/: ext-dash-to-dock.ini
  /org/gnome/shell/extensions/search-light/: ext-search-light.ini
  /org/gnome/shell/extensions/clipboard-indicator/: ext-clipboard-indicator.ini
  /org/gnome/shell/extensions/caffeine/: ext-caffeine.ini
  /org/gnome/shell/extensions/user-theme/: ext-user-theme.ini
